name: Vendored Cheat Agent native integration

on:
  pull_request:
    paths:
      - 'integrations/cheat-agent/**'
      - 'integrations/gtlibcpp'
      - '.gitmodules'
      - '.github/workflows/cheat-agent-native.yml'
      - 'docs/gtlibcpp-cheat-agent-integration.md'
  push:
    branches: [develop]
    paths:
      - 'integrations/cheat-agent/**'
      - '.github/workflows/cheat-agent-native.yml'

jobs:
  native-matrix:
    name: ${{ matrix.os }} GTLibCpp ${{ matrix.enabled }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        enabled: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize GTLibCpp submodule only
        if: matrix.enabled == 'ON'
        shell: bash
        run: git submodule update --init --depth 1 integrations/gtlibcpp
      - name: Verify pinned GTLibCpp checkout
        if: matrix.enabled == 'ON'
        shell: bash
        run: |
          test -f integrations/gtlibcpp/CMakeLists.txt
          git -C integrations/gtlibcpp rev-parse HEAD
          grep -q 'gtlibcpp' integrations/cheat-agent/native/CMakeLists.txt
      - name: Configure native integration
        run: cmake -S integrations/cheat-agent -B build-cheat-agent -DCHEAT_AGENT_ENABLE_GTLIBCPP=${{ matrix.enabled }}
      - name: Build
        run: cmake --build build-cheat-agent --config Release
      - name: Native tests
        run: ctest --test-dir build-cheat-agent -C Release --output-on-failure
      - name: Compile IGI example with GTLibCpp
        if: runner.os == 'Windows' && matrix.enabled == 'ON'
        run: |
          cmake -S integrations/cheat-agent -B build-cheat-agent -DCHEAT_AGENT_BUILD_IGI_EXAMPLE=ON
          cmake --build build-cheat-agent --config Release --target igi_trainer

  gtlibcpp-core:
    name: GTLibCpp independent library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned GTLibCpp submodule
        run: git submodule update --init --depth 1 integrations/gtlibcpp
      - name: Configure GTLibCpp unit tests
        run: cmake -S integrations/gtlibcpp -B build-gtlibcpp -DGTLIBCPP_BUILD_TESTS=ON -DGTLIBCPP_BUILD_EXAMPLES=OFF -DGTLIBCPP_BUILD_DEMOS=OFF
      - name: Build GTLibCpp unit tests
        run: cmake --build build-gtlibcpp --config Release
      - name: Execute GTLibCpp unit tests
        run: ctest --test-dir build-gtlibcpp -C Release --output-on-failure
