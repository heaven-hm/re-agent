name: Bundled maintenance skills validation

on:
  pull_request:
    paths:
      - 'maintenance-skills/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/maintenance-skills.yml'
  push:
    branches: [develop]
    paths:
      - 'maintenance-skills/**'
      - '.github/workflows/maintenance-skills.yml'
  workflow_dispatch:

jobs:
  build-and-skills-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Build generated catalogs
        run: npm run build
      - name: Run focused maintenance skill tests
        run: npx vitest run tests/boundary/filesystem/legacyMaintenance.test.ts
