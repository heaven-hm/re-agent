name: Behavioral graph regression validation

on:
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/behavioral-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavioral-graph-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:fast
      - name: Validate projection, checkpoints, CLI and MCP end to end
        run: >-
          npm run test:focused --
          tests/boundary/filesystem/BehavioralEvidenceGraph.test.ts
          tests/boundary/filesystem/BehavioralGraphProjection.test.ts
          src/application/autonomy/AutonomousInvestigation.test.ts
          tests/acceptance/autonomy.test.ts
